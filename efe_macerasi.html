<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Efe'nin Kelime Macerası</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f6f0;--card:#fff;--ink:#2a1f4d;--main:#0f8a7e;--sun:#ffc83d;--ok:#2e9e4f;--bad:#e8734a;--line:#b9e3d9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14263a;--card:#1f3652;--ink:#fff6e0;--main:#3cc9b8;--line:#2f4f70;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-size:20px;min-height:100vh;text-align:center}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:8px 0 4px;line-height:1.1}
p{margin:6px 0}
.stars{font-size:1.3rem;background:var(--card);border-radius:999px;display:inline-block;padding:2px 16px;border:3px solid var(--sun)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer;border:3px solid var(--line);background:var(--card);border-radius:22px;padding:14px 8px;min-height:64px;transition:transform .12s}
button:active{transform:scale(.95)}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.cat{font-size:1.2rem;font-weight:700}
.cat span{display:block;font-size:3rem;line-height:1.1}
.big{background:var(--main);color:#fff;border-color:var(--main);font-weight:700;font-size:1.3rem;padding:14px 28px;margin-top:14px}
.say{background:var(--sun);border-color:var(--sun);color:#2a1f4d}
.prompt{font-size:1.5rem;font-weight:700;margin:14px 0 4px}
.pic{font-size:7rem;line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.opts.words{grid-template-columns:1fr}
.opt{font-size:3.6rem;line-height:1.1}
.words .opt{font-size:1.8rem;font-weight:700}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{opacity:.35;border-color:var(--bad);animation:sh .3s}
.opt.hint{border-color:var(--sun);border-width:6px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:2.2rem;font-size:1.4rem;font-weight:700}
.bar{height:14px;background:var(--card);border-radius:9px;overflow:hidden;border:2px solid var(--line);margin:8px 0}
.bar i{display:block;height:100%;background:var(--main);width:0;transition:width .3s}
.back{font-size:1rem;min-height:44px;padding:6px 16px;float:left}
.note{font-size:.85rem;opacity:.75;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var DATA={
"Hayvanlar":[["kedi","🐱"],["köpek","🐶"],["kuş","🐦"],["balık","🐟"],["at","🐴"],["inek","🐮"],["tavşan","🐰"],["ördek","🦆"]],
"Meyveler":[["elma","🍎"],["muz","🍌"],["üzüm","🍇"],["çilek","🍓"],["portakal","🍊"],["karpuz","🍉"],["armut","🍐"],["kiraz","🍒"]],
"Eşyalar":[["kitap","📚"],["top","⚽"],["şemsiye","☂️"],["ayakkabı","👟"],["saat","⏰"],["kalem","✏️"],["çanta","🎒"],["bardak","🥛"]],
"Taşıtlar":[["araba","🚗"],["otobüs","🚌"],["uçak","✈️"],["gemi","🚢"],["bisiklet","🚲"],["tren","🚆"],["helikopter","🚁"],["traktör","🚜"]]
};
var ICON={"Hayvanlar":"🐾","Meyveler":"🍓","Eşyalar":"🎒","Taşıtlar":"🚗"};
var PRAISE=["Aferin Efe!","Harika!","Çok güzel!","Bravo!","Süpersin!"];
var app=document.getElementById('app');
var total=0,cat,queue,qi,tries,cur;
try{total=parseInt(localStorage.getItem('efeStars')||'0',10)||0}catch(e){}

function speak(t){
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.75;speechSynthesis.speak(u)}catch(e){}
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function save(){try{localStorage.setItem('efeStars',total)}catch(e){}}
function starsHtml(){return '<div class="stars">⭐ '+total+'</div>'}

function home(){
  var h='<h1>Efe\u2019nin Kelime Macerası</h1>'+starsHtml()+'<p>Bir konu seç!</p><div class="grid">';
  Object.keys(DATA).forEach(function(k){h+='<button class="cat" data-c="'+k+'"><span>'+ICON[k]+'</span>'+k+'</button>'});
  h+='</div><p class="note">Terapist ve aile için: Efe kelimeyi duyar, görür ve kendisi söyler. Cihazın sesi açık olmalıdır.</p>';
  app.innerHTML=h;
  app.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){start(b.dataset.c)}});
}

function start(c){
  cat=c;queue=shuffle(DATA[c]);qi=0;question();
}

function question(){
  if(qi>=queue.length){return finish()}
  cur=queue[qi];tries=0;
  var listen=qi%2===0; // çift: dinle ve resmi seç; tek: resmi gör, kelimeyi seç
  var pool=shuffle(DATA[cat].filter(function(x){return x[0]!==cur[0]})).slice(0,2);
  var opts=shuffle([cur].concat(pool));
  var h='<button class="back" id="bk">← Geri</button>'+starsHtml()+'<div class="bar"><i style="width":'+(qi/queue.length*100)+'%"></i></div>';
  if(listen){
    h+='<p class="prompt">Dinle ve doğru resmi bul</p><button class="big say" id="pl">🔊 Dinle</button><div class="opts">';
    opts.forEach(function(o){h+='<button class="opt" data-w="'+o[0]+'" aria-label="'+o[1]+'">'+o[1]+'</button>'});
    h+='</div>';
  }else{
    h+='<p class="prompt">Bu ne?</p><div class="pic">'+cur[1]+'</div><button class="big say" id="pl">🔊 Dinle</button><div class="opts words">';
    opts.forEach(function(o){h+='<button class="opt" data-w="'+o[0]+'">'+o[0]+'</button>'});
    h+='</div>';
  }
  h+='<div class="msg" id="msg"></div>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  document.getElementById('pl').onclick=function(){speak(cur[0])};
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(b)}});
  setTimeout(function(){speak(listen?cur[0]:'Bu ne?')},400);
}

function pick(b){
  var msg=document.getElementById('msg');
  if(b.dataset.w===cur[0]){
    b.classList.add('ok');total++;save();
    var p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    speak(p+' '+cur[0]);
    setTimeout(sayIt,1300);
  }else{
    tries++;b.classList.add('no');b.disabled=true;
    msg.textContent='Tekrar dene!';speak('Tekrar dene');
    if(tries>=2){app.querySelectorAll('.opt').forEach(function(o){if(o.dataset.w===cur[0])o.classList.add('hint')})}
  }
}

function sayIt(){
  app.innerHTML='<div class="stars">⭐ '+total+'</div><div class="pic">'+cur[1]+'</div><p class="prompt" style="font-size:2.4rem">'+cur[0]+'</p><p>Şimdi sen söyle!</p>'+ 
  '<button class="big say" id="again">🔊 Tekrar dinle</button><br><button class="big" id="next">Söyledim, devam ⭐</button>';
  document.getElementById('again').onclick=function(){speak(cur[0])};
  document.getElementById('next').onclick=function(){qi++;question()};
  setTimeout(function(){speak('Şimdi sen söyle: '+cur[0])},300);
}

function finish(){
  speak('Bravo Efe! Hepsini bitirdin!');
  app.innerHTML='<h1>🎉 Bravo Efe!</h1><div class="pic">🏆</div><p class="prompt">'+cat+' konusunu bitirdin!</p>'+starsHtml()+
  '<br><button class="big" id="again">Yine oyna</button><br><button class="big say" id="hm">Başka konu</button>';
  document.getElementById('again').onclick=function(){start(cat)};
  document.getElementById('hm').onclick=home;
}
home();
</script>
</body>
</html>
